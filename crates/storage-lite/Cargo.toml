[package]
name = "storage-lite"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arrow-lite = { path = "../arrow-lite" }
# No mmap dependency: the working-set cut is owned (the queried working
# set fits in memory; segments fault in whole on first touch — see
# DESIGN.md, "The residency design"), so an mmap backend is retired,
# not deferred; #42's compressed columns cannot be mapped anyway. Ranged
# reads return, if ever, with column-granular residency (#87).

[dev-dependencies]
corpus = { path = "../corpus" }
proptest = "1"
