[package]
name = "storage-lite"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arrow-lite = { path = "../arrow-lite" }
# No mmap dependency: the working-set cut is owned (a table fits in
# memory; v1 opens decode-into-memory — see DESIGN.md, "The axes"), so
# an mmap backend is retired, not deferred. If the reopen trigger ever
# fires, the escape is a zero-copy-open format version behind the I/O
# trait, and the dependency lands then — not before.

[dev-dependencies]
corpus = { path = "../corpus" }
proptest = "1"
