[package]
name = "compute-lua"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Compiles the vendored interpreter with LUA_USE_APICHECK: the Lua
# authors' own C-API-misuse assertions, this binding's discipline
# oracle. Test builds and CI enable it; release builds do not.
apicheck = []

[build-dependencies]
cc = "1"

[dependencies]
arrow-lite = { path = "../arrow-lite" }
# Native backend (settled 2026-07-24; see DESIGN.md, "The Lua layer"):
# canonical PUC Lua 5.4, vendored under vendor/ — unmodified upstream
# sources compiled in via the `cc` build script — with hand-rolled thin
# bindings to the 5.4 C API (src/ffi.rs). No `mlua`, no LuaJIT (both
# rejected with reopen conditions in the decision record).
#
# WASM backend (future, not current milestone): lua.wasm
# (github.com/andy-emerson/lua-wasi) — also Lua 5.4, same C API, behind
# `cfg(target_arch = "wasm32")`. Do not add this dependency until the
# WASM milestone actually starts.

[dev-dependencies]
