[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib exists solely for the Python oracle scripts, which drive the
# `oracle-harness` hooks through ctypes (tests/*.py — the M1 slice, the
# mutation and differential families, the Lua-window and SQL-in-Lua
# families, the as-of sweep, and the latency benchmark).
crate-type = ["lib", "cdylib"]

[features]
# Embedded Lua kernels (the console's opt-in scripting front-end —
# DESIGN.md, *the extension model*, ruled 2026-07-28). Off by default:
# a library embedder who never asks for an interpreter carries neither
# the vendored C nor its CI surface. The primary extension path — the
# `WindowAggregate` trait — needs no feature.
lua = []
# Compiles the vendored interpreter with LUA_USE_APICHECK: the Lua
# authors' own C-API-misuse assertions, the binding's discipline oracle.
# Test builds and CI enable it; release builds do not. Implies `lua`.
apicheck = ["lua"]
# Compiles the extern "C" oracle hooks (src/harness.rs). Dev/CI only.
# Implies `lua`: the oracle fixtures include the Lua-window family.
oracle-harness = ["dep:corpus", "lua"]

[dependencies]
arrow-lite = { path = "../arrow-lite" }
storage-lite = { path = "../storage-lite" }
query-lite = { path = "../query-lite" }
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
corpus = { path = "../corpus", optional = true }

[build-dependencies]
# Compiles the vendored PUC Lua 5.4 sources under src/compute_lua/vendor
# when the `lua` feature is on (build.rs).
cc = "1"

[dev-dependencies]
