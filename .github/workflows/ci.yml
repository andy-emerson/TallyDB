# CI — the executable evidence of AGENTS.md, run on every change.
# Every push to main and every pull request re-earns the claims below:
# formatting, lints, build, tests (including doctests), rustdoc, and the
# PyArrow round-trip oracle for the C Data Interface.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Documentation is a first-class artifact here (see AGENTS.md): a rustdoc
  # warning is a failing doc claim, not a nit.
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain versions
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test (includes doctests and the arrow-rs oracle)
        run: cargo test --workspace
      - name: Engine without Lua (the default embedder build — the
          feature is opt-in, so the off-leg must stay green on its own)
        run: |
          cargo clippy -p engine --all-targets -- -D warnings
          cargo test -p engine
          RUSTDOCFLAGS="-D warnings" cargo doc -p engine --no-deps
      - name: Docs
        run: cargo doc --workspace --no-deps
      - name: PyArrow oracle (issue #15)
        run: |
          cargo build -p arrow-lite --features oracle-harness
          pip install pyarrow cffi
          python3 crates/arrow-lite/tests/pyarrow_roundtrip.py target/debug/libarrow_lite.so
      - name: M1 slice oracle — NumPy + DuckDB (issue #27)
        run: |
          cargo build -p engine --features oracle-harness
          pip install numpy duckdb
          python3 crates/engine/tests/m1_slice_oracle.py target/debug/libengine.so
      - name: M2.3 mutation oracle — DuckDB differential (issue #35)
        run: python3 crates/engine/tests/m2_mutation_oracle.py target/debug/libengine.so
      - name: M2.4 differential harness — generated queries vs DuckDB (issue #36)
        run: python3 crates/engine/tests/m2_differential_oracle.py target/debug/libengine.so
      - name: M2.7 Lua-window oracle — NumPy differential (issue #41)
        run: python3 crates/engine/tests/m2_lua_window_oracle.py target/debug/libengine.so
      - name: M4.4 as-of oracle — DuckDB over an explicit history table (issue #75)
        run: python3 crates/engine/tests/m4_asof_oracle.py target/debug/libengine.so
      - name: Lua apicheck build — the interpreter's own C-API-misuse assertions (issue #41)
        run: cargo test -p compute-lua --features apicheck

  # The C boundary under the sanitizers: the vendored interpreter and the
  # binding's C accessors compiled with ASan (leaks included — the
  # longjmp-over-destructor discipline is exactly a leak generator when
  # violated) and UBSan in trap mode. Nightly because sanitizers are -Z
  # flags. The remaining hardening (#69) — ltests.c torture and the official
  # Lua suite over the vendored build — needs files this repo does not
  # carry (the vendor tree is deliberately the embedding set, no lua.c);
  # they land when the suite can be vendored with provenance.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain (sanitizers are -Z flags)
        run: rustup toolchain install nightly --profile minimal
      - name: ASan + UBSan over compute-lua (vendored C included)
        env:
          RUSTFLAGS: -Zsanitizer=address
          CFLAGS: -fsanitize=address -fsanitize=undefined -fsanitize-undefined-trap-on-error
        run: cargo +nightly test -p compute-lua --features apicheck --target x86_64-unknown-linux-gnu
