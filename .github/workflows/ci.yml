# CI — the executable evidence of AGENTS.md, run on every change.
# Every push to main and every pull request re-earns the claims below:
# formatting, lints, build, tests (including doctests), rustdoc, and the
# PyArrow round-trip oracle for the C Data Interface.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Documentation is a first-class artifact here (see AGENTS.md): a rustdoc
  # warning is a failing doc claim, not a nit.
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lockfile is current (Cargo.lock is committed; a stale one fails here,
          not silently re-resolved)
        run: cargo fetch --locked
      - name: Rust toolchain versions
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build
      - name: Test (includes doctests and the arrow-rs oracle)
        run: cargo test
      - name: Library without Lua or the console (--no-default-features — the
          library-only embedder build must stay green on its own)
        run: |
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo test --no-default-features
          RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --document-private-items --no-default-features
      - name: Docs
        run: cargo doc --no-deps --document-private-items
      - name: PyArrow oracle (issue #15)
        run: |
          cargo build --features oracle-harness
          pip install pyarrow cffi
          python3 tests/pyarrow_roundtrip.py target/debug/libtallydb.so
      - name: M1 slice oracle — NumPy + DuckDB (issue #27)
        run: |
          cargo build --features oracle-harness
          pip install numpy duckdb
          python3 tests/m1_slice_oracle.py target/debug/libtallydb.so
      - name: M2.3 mutation oracle — DuckDB differential (issue #35)
        run: python3 tests/m2_mutation_oracle.py target/debug/libtallydb.so
      - name: M2.4 differential harness — generated queries vs DuckDB (issue #36)
        run: python3 tests/m2_differential_oracle.py target/debug/libtallydb.so
      - name: Lua families oracle — NumPy differential (kernels #41, driver #70)
        run: python3 tests/m2_lua_window_oracle.py target/debug/libtallydb.so
      - name: M4.4 as-of oracle — DuckDB over an explicit history table (issue #75)
        run: python3 tests/m4_asof_oracle.py target/debug/libtallydb.so
      - name: Maintained-view oracle — DuckDB recompute at scripted checkpoints (issue #83)
        run: python3 tests/m5_view_oracle.py target/debug/libtallydb.so
      - name: Join-view oracle — DuckDB's native ASOF JOIN as recompute (issue #83, tranche 3)
        run: python3 tests/m5_join_oracle.py target/debug/libtallydb.so
      - name: Multi-factor oracle — NumPy lstsq over rebuilt design matrices (issue #90)
        run: python3 tests/m5_multifactor_oracle.py target/debug/libtallydb.so
      - name: Lua apicheck build — the interpreter's own C-API-misuse assertions (issue #41)
        run: cargo test --features apicheck

  # The unsafe core under Miri (issue #63): the arrow_lite module
  # concentrates the crate's unsafe (aligned buffers, bitmaps, the C
  # Data Interface),
  # and Miri checks it for undefined behavior on every change instead of
  # by hand. Isolation is disabled because proptest touches the
  # filesystem; the case count is trimmed to keep the interpreter's
  # ~50x cost inside a few minutes.
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lockfile is current (Cargo.lock is committed; a stale one fails here,
          not silently re-resolved)
        run: cargo fetch --locked
      - name: Nightly toolchain with Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Miri over arrow_lite
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: "4"
        run: "cargo +nightly miri test --no-default-features --lib arrow_lite::"

  # The official Lua 5.4.7 test suite over the vendored interpreter
  # (issue #69): the release's own ltests instrumentation compiled in
  # (tracing allocator with failure injection, stack/GC consistency
  # asserts, the T library), built from the exact sources the engine
  # embeds — byte-identical to the upstream v5.4.7 tag; see
  # src/compute_lua/upstream-tests/PROVENANCE.md.
  lua-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: readline headers (main.lua's transcripts assume readline)
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev
      - name: Build the instrumented interpreter, run all.lua
        run: src/compute_lua/upstream-tests/run.sh

  # The C boundary under the sanitizers: the vendored interpreter and the
  # binding's C accessors compiled with ASan (leaks included — the
  # longjmp-over-destructor discipline is exactly a leak generator when
  # violated) and UBSan in trap mode. Nightly because sanitizers are -Z
  # flags. Scoped to compute_lua's tests: the storage tests model power
  # loss by forgetting a store on purpose, which LeakSanitizer counts as
  # a leak at exit, so the whole crate cannot run under the leak check
  # as written. The ltests torture and official suite (#69) run in the
  # lua-suite job above.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lockfile is current (Cargo.lock is committed; a stale one fails here,
          not silently re-resolved)
        run: cargo fetch --locked
      - name: Nightly toolchain (sanitizers are -Z flags)
        run: rustup toolchain install nightly --profile minimal
      - name: ASan + UBSan over compute_lua (vendored C included)
        env:
          RUSTFLAGS: -Zsanitizer=address
          CFLAGS: -fsanitize=address -fsanitize=undefined -fsanitize-undefined-trap-on-error
        run: "cargo +nightly test --features apicheck --target x86_64-unknown-linux-gnu --lib compute_lua::"
